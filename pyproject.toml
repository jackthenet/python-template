# pyproject.toml — default template for Python projects
[project]
name = "python-template"
version = "0.5.0"
description = "Default template for Python projects."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Domain and request/response validation models.
    "pydantic>=2.13.5",
    # Structured application logging across backend and UI integrations.
    "loguru>=0.7.3",
    # High-performance JSON serialization/deserialization.
    "orjson>=3.12.0",
    # HTTP client for outbound calls.
    "httpx>=0.28.1",
    "sqlmodel>=0.0.42",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "filetype>=1.2.0",
    # Image decode validation + variant generation (file-management avatars).
    "pillow>=12.3.0",
    # Safe YAML serialization for settings value/template storage.
    "ruamel-yaml>=0.19.1",
]

[dependency-groups]
# Development-only tooling installed by `uv sync`; keep runtime packages out of
# this group so deploy and compatibility mirrors stay minimal.
dev = [
    # Database schema migration tooling.
    "alembic>=1.20.0",
    # Security-focused static analysis for Python code.
    "bandit>=1.9.4",
    # Complexity reporting used during refactors and cleanup work.
    "complexipy>=8.0.1",
    # Dependency checker (unused/missing/transitive deps).
    "deptry>=0.25.1",
    # Property-based testing for pure logic and boundary-heavy helpers.
    "hypothesis>=6.168.0",
    # MkDocs static site build system.
    "mkdocs>=1.6",
    # MkDocs Material theme for the published documentation site.
    "mkdocs-material>=9.5",
    # MkDocs plugin: API docs from docstrings (python extra: docstring handler).
    "mkdocstrings[python]>=1.0.6",
    # Static type checking for the source tree.
    "mypy>=2.3.1",
    # Vulnerability scanning for installed dependencies.
    "pip-audit>=2.10.1",
    # Test data factories for pydantic models.
    "polyfactory>=3.3.0",
    # Pre-commit automation for local quality gates.
    "pre-commit>=4.6.2",
    # Low-overhead sampling profiler for live Python processes and spawned commands.
    "py-spy>=0.4.2",
    # Unit and integration test runner.
    "pytest>=9.1.1",
    # Coverage reporting for the verify phase (spec/branch coverage evidence).
    "pytest-cov>=7.1.0",
    # Randomized pytest ordering (maintained successor to pytest-random).
    "pytest-randomly>=5.0.0",
    # Parallel pytest execution for faster focused and full-suite runs.
    "pytest-xdist>=3.8.0",
    # httpx mocking for outbound-call tests.
    "respx>=0.23.1",
    # Linting, formatting, and autofix checks.
    "ruff>=0.16.8",
    # Time travel for time-dependent tests.
    "time-machine>=3.5.1",
    # Fast type checker for the source tree.
    "ty>=0.0.82",
]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.bumpversion]
current_version = "0.5.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = true
message = "Bump version: {current_version} → {new_version}"
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.complexipy]
paths = ["src", "tests"]
max-complexity-allowed = 30

[tool.coverage.run]
branch = true
# Cover both runtime boundaries (src/ layout). Paths (not module names) so the
# empty `frontend` placeholder is covered once implemented without a
# "never imported" warning.
source = ["src/backend", "src/frontend"]

[tool.coverage.report]
# Floor of the 2026-09-15 coverage baseline (92.74%); raise as coverage improves.
fail_under = 92

[tool.deptry]
known_first_party = ["backend"]
# The ruamel-yaml distribution is imported as the top-level module `ruamel`.
package_module_name_map = { "ruamel-yaml" = "ruamel" }

[tool.deptry.per_rule_ignores]
# CLI tools / pytest plugins that are never imported from source, plus the
# declared runtime capabilities (httpx, orjson) not yet imported from source.
DEP002 = [
    "bandit", "complexipy", "httpx", "mkdocs", "mkdocs-material", "mkdocstrings",
    "mypy", "orjson", "pip-audit", "pre-commit", "py-spy", "pytest-cov",
    "pytest-randomly", "pytest-xdist", "ruff", "ty",
]
# Optional production dependency: py-webauthn is deferred-imported inside
# PyWebAuthnProvider (the fake provider is the test seam), so it is
# intentionally not declared.
DEP001 = ["webauthn"]
# Transitive runtime dep (via sqlmodel) imported by repositories and the
# alembic scaffold (migrations/env.py).
DEP003 = ["sqlalchemy"]
# The alembic scaffold (migrations/env.py) is tooling code that
# legitimately imports alembic, which is a dev dependency.
DEP004 = ["alembic"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
# `src/backend/` is a namespace package (no `__init__.py`); these flags let
# `mypy src/` resolve `backend.logging` correctly without CLI flags.
explicit_package_bases = true
namespace_packages = true

[tool.ty.environment]
# mypy `python_version = "3.14"` equivalent (ty also infers it from
# `project.requires-python`; pinned explicitly for documentation).
python-version = "3.14"
# mypy `explicit_package_bases = true` + `namespace_packages = true`
# equivalent: the first-party module root. ty searches for first-party
# modules in the project root or `src` by default; `./src` is set
# explicitly so `backend.*` (namespace-package layout, no `__init__.py`
# in `src/backend/`) resolves as `backend.<feature>`.
root = ["./src"]

[tool.ty.analysis]
# mypy `ignore_missing_imports = true` equivalent, scoped to the only
# third-party package without type information (verified 2026-09-15:
# sqlmodel/sqlalchemy/pydantic/loguru all ship `py.typed`).
allowed-unresolved-imports = ["webauthn"]
# mypy `check_untyped_defs = true` has no ty equivalent: ty analyzes all
# function bodies by default.

[tool.ruff]
target-version = "py314"
indent-width = 4
line-length = 120

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

[tool.ruff.lint]
# See complete list: https://docs.astral.sh/ruff/rules/
select = [
    "I",  # isort
    "E",  # pycodestyle
    "W",  # pycodestyle
    "B",  # bugbear
    "F",  # pyflakes
    "UP", # pyupgrade
    "RUF", # ruff
    "PL", # pylint
    "Q", # flake8-quotes
    "SIM",
    "C4",
]
fixable = [
    "I",  # isort
    "UP035", # deprecated import
    "RUF022", # `__all__` is not sorted
    "Q000",  # bad quotes inline string
    "Q001",  # bad quotes multiline string
    "Q002",  # bad quotes docstring
    "Q003",  # avoidable escaped quote
    "Q004",  # unnecessary escaped quote
]
ignore = [
    "PLR0913",
    "E501", # line too long
    "PLC0415", # import outside top level
]
exclude = [
    "data/", "__pycache__", ".venv", "venv", "build", "dist",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.agent-runner]
tasks_file = ".github/task-runner/tasks.json"
test_command = "uv run pytest"
quality_check = "uv run ruff check src/ && uv run mypy src/"
max_retries = 3
