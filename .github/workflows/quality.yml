name: Quality

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Sync tooling
        run: uv sync --only-group dev
      - name: Run mypy (gate)
        run: uv run mypy src/
      - name: Run ty (informational)
        run: uv run ty check src/
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Sync tooling
        run: uv sync --only-group dev
      - name: Run pip-audit
        run: uv run pip-audit
      - name: Run bandit
        run: uv run bandit -r src/

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Sync tooling
        run: uv sync --only-group dev
      # pytest-cov honors `[tool.coverage.report] fail_under` (92) from pyproject.toml.
      - name: Run pytest with coverage
        run: uv run pytest tests/ --cov --cov-report=xml

  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Sync tooling
        run: uv sync --only-group dev
      # PR-time dependency gate (lockfile diff review).
      - uses: actions/dependency-review-action@v5
