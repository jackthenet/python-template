name: Spec Validation

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/specs/**'
      - 'docs/tasks/**'
      - 'docs/verification/**'
      - 'tests/**'
      - 'src/**'
      - 'scripts/verify_spec.py'
      - 'pyproject.toml'
  push:
    branches: [ main ]
    paths:
      - 'docs/specs/**'
      - 'docs/tasks/**'
      - 'docs/verification/**'
      - 'tests/**'
      - 'src/**'
      - 'scripts/verify_spec.py'
      - 'pyproject.toml'

jobs:
  spec-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Sync tooling
        run: uv sync --only-group dev
      - name: Run spec validation
        run: uv run python scripts/verify_spec.py docs/specs/template.md
      - name: Validate task DAG
        run: uv run python scripts/validate_task_dag.py .github/task-runner/tasks.json || true
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Sync tooling
        run: uv sync --only-group dev
      - name: Run acceptance tests
        run: uv run pytest tests/acceptance/ -v
      - name: Run property tests
        run: uv run pytest tests/property/ -v
      - name: Run unit tests
        run: uv run pytest tests/unit/ -v
      - name: Run full suite
        run: uv run pytest tests/ -v
