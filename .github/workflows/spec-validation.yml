name: Spec Validation

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/specs/**'
      - 'docs/tasks/**'
      - 'docs/verification/**'
      - 'tests/**'
      - 'src/**'
      - 'scripts/verify_spec.py'
      - 'pyproject.toml'
  push:
    branches: [ main ]
    paths:
      - 'docs/specs/**'
      - 'docs/tasks/**'
      - 'docs/verification/**'
      - 'tests/**'
      - 'src/**'
      - 'scripts/verify_spec.py'
      - 'pyproject.toml'

jobs:
  spec-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Sync tooling
        run: uv sync --only-group dev
      - name: Run spec validation
        run: |
          for spec in docs/specs/*.md; do
            [ "$(basename "$spec")" = "template.md" ] && continue
            echo "Validating $spec"
            uv run python scripts/verify_spec.py "$spec" || exit 1
          done
      - name: Validate task DAG
        run: uv run python scripts/validate_task_dag.py .github/task-runner/tasks.json || true
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Sync tooling
        run: uv sync --only-group dev
      - name: Run test suites
        run: |
          if ls tests/**/test_*.py 1>/dev/null 2>&1; then
            uv run pytest tests/ -v
          else
            echo "No tests yet (expected RED state on spec PR)"
          fi
