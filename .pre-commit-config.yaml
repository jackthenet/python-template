default_language_version:
  python: python
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

# Review hook revisions during the first maintenance week of each month and any
# time the Python or CI toolchain changes materially.

repos:
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.2
    hooks:
      - id: check-jsonschema
        name: Validate Ruff post-edit hook config
        args: [--schemafile, .github/hooks/ruff-post-edit.schema.json]
        files: ^\.github/hooks/ruff-post-edit\.json$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/rohaquinlop/complexipy-pre-commit
    rev: v5.1.0
    hooks:
      - id: complexipy
