default_language_version:
  python: python
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

# Review hook revisions during the first maintenance week of each month and any
# time the Python or CI toolchain changes materially.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/rohaquinlop/complexipy-pre-commit
    rev: v5.1.0
    hooks:
      - id: complexipy
  # Local hooks: run the project's own tooling via uv (system environment).
  - repo: local
    hooks:
      - id: deptry
        name: deptry (unused dependencies)
        entry: uv run deptry .
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^(pyproject\.toml|uv\.lock|src/|tests/|scripts/|migrations/)
      - id: mkdocs-build
        name: mkdocs build --strict
        entry: uv run mkdocs build --strict
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(mkdocs\.yml|userdocs/|pyproject\.toml)
